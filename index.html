<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="挑選喜歡的甜品，客製份量、口味與製作方式，查看專屬食譜。">
  <title>甜點日常｜甜品食譜</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #322c29;
      --muted: #817873;
      --paper: #f8f7f3;
      --white: #fffefa;
      --rose: #a85245;
      --rose-light: #f3e5df;
      --green: #526553;
      --line: #e8e2dc;
      --shadow: 0 16px 42px rgba(67, 49, 39, .07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.65;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 48px));
      margin-inline: auto;
    }

    .topbar {
      display: flex;
      min-height: 78px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 19px;
      font-weight: 750;
      letter-spacing: .07em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 12px 12px 12px 4px;
      background: var(--rose);
      color: white;
      font-size: 18px;
      letter-spacing: 0;
    }

    .nav-note {
      color: var(--muted);
      font-size: 13px;
    }

    .hero {
      display: grid;
      min-height: 320px;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 32px;
      padding-block: 54px 60px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--rose);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1.25;
    }

    .hero-copy {
      max-width: 550px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .hero-stamp {
      display: grid;
      width: 144px;
      aspect-ratio: 1;
      align-content: center;
      justify-items: center;
      border: 1px solid #e8c9bd;
      border-radius: 50%;
      color: var(--rose);
      transform: rotate(8deg);
    }

    .hero-stamp span:first-child {
      font-size: 33px;
      line-height: 1.2;
    }

    .hero-stamp span:last-child {
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: .08em;
    }

    .catalog {
      padding-block: 36px 64px;
      border-top: 1px solid var(--line);
    }

    .section-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .section-top h2 {
      margin-bottom: 0;
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -.03em;
    }

    .section-top p {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 24px;
    }

    .category-button,
    .choice-button {
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, color .18s ease;
    }

    .category-button {
      min-height: 37px;
      padding: 0 16px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
    }

    .category-button:hover,
    .choice-button:hover {
      border-color: var(--rose);
    }

    .category-button[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .recipe-card {
      display: block;
      width: 100%;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--white);
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .recipe-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .recipe-card[aria-pressed="true"] {
      border-color: var(--rose);
      box-shadow: 0 0 0 2px rgba(168, 82, 69, .14);
    }

    .recipe-art {
      display: grid;
      height: 150px;
      place-items: center;
      background: var(--art-bg);
      color: var(--art-ink);
      font-size: 58px;
    }

    .recipe-card-copy {
      padding: 15px 17px 17px;
    }

    .recipe-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .recipe-card-title {
      display: block;
      margin-bottom: 5px;
      font-size: 17px;
      font-weight: 650;
    }

    .recipe-card-description {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .detail {
      margin-bottom: 70px;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--white);
      scroll-margin-top: 20px;
    }

    .detail-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .detail-heading .eyebrow {
      margin-bottom: 7px;
    }

    .detail-heading h2 {
      margin-bottom: 6px;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .detail-heading p:last-child {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .yield-badge {
      flex: 0 0 auto;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--rose-light);
      color: var(--rose);
      font-size: 12px;
      font-weight: 650;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: .88fr 1.12fr;
      gap: 34px;
      padding-top: 24px;
    }

    .options h3,
    .ingredients h3,
    .steps h3 {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 700;
    }

    .option-group {
      margin-bottom: 23px;
    }

    .option-label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .choice-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-button {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .choice-button[aria-pressed="true"] {
      border-color: var(--rose);
      background: var(--rose-light);
      color: var(--rose);
      font-weight: 650;
    }

    .flavor-note {
      min-height: 44px;
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .recipe-content {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 24px;
    }

    .ingredients,
    .steps {
      padding: 18px;
      border-radius: 11px;
      background: #faf8f4;
    }

    .ingredient-list,
    .step-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .ingredient-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-block: 8px;
      border-bottom: 1px dashed var(--line);
      font-size: 12px;
    }

    .ingredient-list li:last-child {
      border-bottom: 0;
    }

    .ingredient-amount {
      flex: 0 0 auto;
      color: var(--green);
      font-weight: 650;
    }

    .method-note {
      margin: -5px 0 9px;
      color: var(--muted);
      font-size: 11px;
    }

    .step-list {
      counter-reset: step;
    }

    .step-list li {
      position: relative;
      margin-bottom: 10px;
      padding-left: 27px;
      color: #5e5752;
      font-size: 12px;
      counter-increment: step;
    }

    .step-list li:last-child {
      margin-bottom: 0;
    }

    .step-list li::before {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      width: 19px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: var(--rose-light);
      color: var(--rose);
      content: counter(step);
      font-size: 10px;
      font-weight: 700;
    }

    footer {
      padding-block: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #c98172;
      outline-offset: 3px;
    }

    @media (max-width: 820px) {
      .detail-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .options h3 {
        grid-column: 1 / -1;
        margin-bottom: -2px;
      }

      .option-group {
        margin-bottom: 6px;
      }

      .recipe-content {
        grid-template-columns: 1fr 1.3fr;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 32px, 500px);
      }

      .topbar {
        min-height: 68px;
      }

      .nav-note {
        max-width: 150px;
        text-align: right;
      }

      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 20px;
        padding-block: 48px 40px;
      }

      .hero-stamp {
        display: none;
      }

      .section-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .recipe-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
      }

      .recipe-art {
        height: 112px;
        font-size: 43px;
      }

      .recipe-card-copy {
        padding: 12px;
      }

      .recipe-card-meta {
        font-size: 10px;
      }

      .recipe-card-title {
        font-size: 15px;
      }

      .recipe-card-description {
        font-size: 11px;
      }

      .detail {
        padding: 20px 16px;
      }

      .detail-heading {
        gap: 12px;
      }

      .yield-badge {
        padding: 7px 9px;
        font-size: 10px;
      }

      .options {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .options h3 {
        margin-bottom: 12px;
      }

      .option-group {
        margin-bottom: 16px;
      }

      .recipe-content {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .catalog {
        padding-bottom: 42px;
      }

      .footer-inner {
        flex-direction: column;
        gap: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="#" aria-label="甜點日常首頁">
      <span class="brand-mark" aria-hidden="true">甜</span>
      <span>甜點日常</span>
    </a>
    <span class="nav-note">挑選甜品，做出你的喜歡。</span>
  </header>

  <main>
    <section class="shell hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">DESSERT RECIPE NOTES</p>
        <h1 id="page-title">今天，想做哪一種甜？</h1>
        <p class="hero-copy">從蛋糕、布丁到餅乾，找到喜歡的甜品，再依照想要的份量、口味和器具，挑一份剛剛好的做法。</p>
      </div>
      <div class="hero-stamp" aria-hidden="true">
        <span>甜</span>
        <span>慢慢做，也很好</span>
      </div>
    </section>

    <section class="shell catalog" aria-labelledby="catalog-title">
      <div class="section-top">
        <h2 id="catalog-title">挑選一款甜品</h2>
        <p>點選卡片後，可調整食譜設定。</p>
      </div>
      <div class="categories" id="categories" aria-label="甜品類別"></div>
      <div class="recipe-grid" id="recipe-grid" aria-live="polite"></div>
    </section>

    <section class="shell detail" id="recipe-detail" aria-live="polite" aria-labelledby="detail-title"></section>
  </main>

  <footer>
    <div class="shell footer-inner">
      <span>甜點日常｜把喜歡的甜，慢慢做出來。</span>
      <span>食譜份量可依需求調整，烤箱與器具加熱狀況可能不同。</span>
    </div>
  </footer>

  <script>
    const recipes = [
      {
        id: "pound-cake",
        name: "檸檬磅蛋糕",
        category: "蛋糕",
        icon: "🍋",
        art: ["#f3edda", "#9b7938"],
        description: "奶油香氣裡帶著清爽檸檬香。",
        time: "約 50 分鐘",
        sizes: [
          { label: "迷你 4 吋", yield: "約 2 人份", factor: 0.5 },
          { label: "標準 6 吋", yield: "約 4 人份", factor: 1 },
          { label: "分享 8 吋", yield: "約 6 人份", factor: 1.5 }
        ],
        flavors: [
          { label: "檸檬", note: "清新微酸，保留檸檬皮屑與檸檬汁。" , extra: [{ name: "檸檬汁", amount: 20, unit: "ml" }, { name: "檸檬皮屑", amount: 1, unit: "顆份" }] },
          { label: "伯爵茶", note: "茶香溫柔，適合搭配無糖熱茶。", extra: [{ name: "伯爵茶葉", amount: 4, unit: "g" }] },
          { label: "可可", note: "加一點可可粉，奶油香更濃厚。", extra: [{ name: "無糖可可粉", amount: 15, unit: "g" }] }
        ],
        ingredients: [
          { name: "低筋麵粉", amount: 120, unit: "g" },
          { name: "無鹽奶油", amount: 110, unit: "g" },
          { name: "細砂糖", amount: 90, unit: "g" },
          { name: "雞蛋", amount: 2, unit: "顆" },
          { name: "牛奶", amount: 25, unit: "ml" },
          { name: "泡打粉", amount: 3, unit: "g" }
        ],
        methods: [
          {
            label: "烤箱",
            note: "先預熱烤箱，表面上色過快時可加蓋鋁箔。",
            steps: ["奶油放至室溫軟化，與細砂糖拌打至顏色變淡。", "分次加入雞蛋拌勻，再加入牛奶與所選口味材料。", "篩入低筋麵粉與泡打粉，拌至看不見乾粉後倒入模具。", "烤箱預熱至 170°C，烘烤約 35–40 分鐘，竹籤插入不沾麵糊即可。"]
          },
          {
            label: "氣炸鍋",
            note: "使用可放入氣炸鍋的模具，依機型狀況留意上色。",
            steps: ["奶油放至室溫軟化，與細砂糖拌打至顏色變淡。", "分次加入雞蛋拌勻，再加入牛奶與所選口味材料。", "篩入低筋麵粉與泡打粉，拌至看不見乾粉後倒入模具。", "氣炸鍋預熱至 160°C，烘烤約 25–30 分鐘，竹籤插入不沾麵糊即可。"]
          }
        ]
      },
      {
        id: "pudding",
        name: "焦糖布丁",
        category: "布丁",
        icon: "🍮",
        art: ["#f2e5d7", "#a76c3e"],
        description: "滑嫩蛋香配上微苦焦糖。",
        time: "約 45 分鐘",
        sizes: [
          { label: "2 杯", yield: "約 2 人份", factor: 0.5 },
          { label: "4 杯", yield: "約 4 人份", factor: 1 },
          { label: "6 杯", yield: "約 6 人份", factor: 1.5 }
        ],
        flavors: [
          { label: "香草", note: "經典蛋奶香，搭配淡淡香草氣息。", extra: [{ name: "香草精", amount: 4, unit: "ml" }] },
          { label: "咖啡", note: "帶有大人感的咖啡香，甜度可依喜好調整。", extra: [{ name: "即溶咖啡粉", amount: 4, unit: "g" }] },
          { label: "抹茶", note: "茶香清雅，建議先用少量牛奶調開抹茶粉。", extra: [{ name: "抹茶粉", amount: 4, unit: "g" }] }
        ],
        ingredients: [
          { name: "牛奶", amount: 400, unit: "ml" },
          { name: "雞蛋", amount: 3, unit: "顆" },
          { name: "細砂糖（布丁液）", amount: 35, unit: "g" },
          { name: "細砂糖（焦糖）", amount: 50, unit: "g" },
          { name: "水（焦糖）", amount: 15, unit: "ml" }
        ],
        methods: [
          {
            label: "烤箱水浴",
            note: "烤盤注入熱水至布丁杯約 1/3 高，幫助均勻受熱。",
            steps: ["小鍋加熱焦糖用砂糖與水，煮至琥珀色後倒入布丁杯底。", "牛奶加熱至微溫，加入布丁液用砂糖拌至溶解。", "雞蛋打散後緩緩倒入牛奶液，過篩後加入所選口味材料。", "倒入布丁杯並覆上鋁箔，放入預熱至 150°C 的水浴烤箱，烤約 30–35 分鐘。", "放涼後冷藏至少 2 小時，再脫模享用。"]
          },
          {
            label: "電鍋蒸",
            note: "外鍋加入約 1 杯水，鍋蓋留一小縫避免表面蜂窩。",
            steps: ["小鍋加熱焦糖用砂糖與水，煮至琥珀色後倒入布丁杯底。", "牛奶加熱至微溫，加入布丁液用砂糖拌至溶解。", "雞蛋打散後緩緩倒入牛奶液，過篩後加入所選口味材料。", "倒入布丁杯並覆上鋁箔，放入電鍋蒸至凝固，約 15–20 分鐘。", "放涼後冷藏至少 2 小時，再脫模享用。"]
          }
        ]
      },
      {
        id: "cookies",
        name: "手作奶油餅乾",
        category: "餅乾",
        icon: "🍪",
        art: ["#eee7df", "#8e6444"],
        description: "酥鬆奶香，配一杯咖啡剛剛好。",
        time: "約 30 分鐘",
        sizes: [
          { label: "約 8 片", yield: "約 2 人份", factor: 0.5 },
          { label: "約 16 片", yield: "約 4 人份", factor: 1 },
          { label: "約 24 片", yield: "約 6 人份", factor: 1.5 }
        ],
        flavors: [
          { label: "巧克力豆", note: "經典奶油餅乾，加入巧克力豆增添口感。", extra: [{ name: "巧克力豆", amount: 70, unit: "g" }] },
          { label: "抹茶", note: "茶香微苦回甘，可搭配白巧克力豆。", extra: [{ name: "抹茶粉", amount: 8, unit: "g" }, { name: "白巧克力豆", amount: 40, unit: "g" }] },
          { label: "燕麥葡萄", note: "加入燕麥與葡萄乾，口感更豐富。", extra: [{ name: "燕麥片", amount: 45, unit: "g" }, { name: "葡萄乾", amount: 35, unit: "g" }] }
        ],
        ingredients: [
          { name: "低筋麵粉", amount: 200, unit: "g" },
          { name: "無鹽奶油", amount: 100, unit: "g" },
          { name: "細砂糖", amount: 70, unit: "g" },
          { name: "雞蛋", amount: 1, unit: "顆" },
          { name: "鹽", amount: 1, unit: "g" }
        ],
        methods: [
          {
            label: "烤箱",
            note: "麵糰冷藏後較容易整形；餅乾出爐時中心略軟是正常的。",
            steps: ["奶油放至室溫軟化，加入細砂糖與鹽拌勻。", "加入雞蛋拌勻，再加入所選口味材料。", "篩入低筋麵粉拌成麵糰，分成小球後稍微壓扁。", "烤箱預熱至 170°C，烘烤約 12–15 分鐘，邊緣微金黃即可。", "取出放涼，餅乾會隨冷卻變得酥脆。"]
          },
          {
            label: "氣炸鍋",
            note: "分批烘烤並預留空間，時間可依餅乾厚度微調。",
            steps: ["奶油放至室溫軟化，加入細砂糖與鹽拌勻。", "加入雞蛋拌勻，再加入所選口味材料。", "篩入低筋麵粉拌成麵糰，分成小球後稍微壓扁。", "氣炸鍋預熱至 160°C，烘烤約 8–10 分鐘，邊緣微金黃即可。", "取出放涼，餅乾會隨冷卻變得酥脆。"]
          }
        ]
      }
    ];

    const categories = ["全部", ...new Set(recipes.map((recipe) => recipe.category))];
    const state = {
      category: "全部",
      recipeId: recipes[0].id,
      sizeIndex: 1,
      flavorIndex: 0,
      methodIndex: 0
    };

    const categoryContainer = document.querySelector("#categories");
    const recipeGrid = document.querySelector("#recipe-grid");
    const detail = document.querySelector("#recipe-detail");

    function visibleRecipes() {
      return state.category === "全部"
        ? recipes
        : recipes.filter((recipe) => recipe.category === state.category);
    }

    function selectedRecipe() {
      return recipes.find((recipe) => recipe.id === state.recipeId);
    }

    function renderCategories() {
      categoryContainer.innerHTML = categories.map((category) => `
        <button class="category-button" type="button" data-category="${category}" aria-pressed="${state.category === category}">
          ${category}
        </button>
      `).join("");
    }

    function renderCards() {
      recipeGrid.innerHTML = visibleRecipes().map((recipe) => `
        <button class="recipe-card" type="button" data-recipe="${recipe.id}" aria-pressed="${state.recipeId === recipe.id}">
          <span class="recipe-art" style="--art-bg:${recipe.art[0]};--art-ink:${recipe.art[1]}" aria-hidden="true">${recipe.icon}</span>
          <span class="recipe-card-copy">
            <span class="recipe-card-meta"><span>${recipe.category}</span><span>${recipe.time}</span></span>
            <span class="recipe-card-title">${recipe.name}</span>
            <span class="recipe-card-description">${recipe.description}</span>
          </span>
        </button>
      `).join("");
    }

    function formatAmount(amount) {
      return Number.isInteger(amount) ? String(amount) : amount.toFixed(1).replace(/\.0$/, "");
    }

    function renderChoiceGroup(label, choices, selectedIndex, group) {
      return `
        <div class="option-group">
          <span class="option-label">${label}</span>
          <div class="choice-list" role="group" aria-label="${label}">
            ${choices.map((choice, index) => `
              <button class="choice-button" type="button" data-group="${group}" data-index="${index}" aria-pressed="${selectedIndex === index}">
                ${choice.label}
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderDetail() {
      const recipe = selectedRecipe();
      const size = recipe.sizes[state.sizeIndex];
      const flavor = recipe.flavors[state.flavorIndex];
      const method = recipe.methods[state.methodIndex];
      const ingredients = [...recipe.ingredients, ...flavor.extra];

      detail.innerHTML = `
        <div class="detail-heading">
          <div>
            <p class="eyebrow">${recipe.category}食譜・${recipe.time}</p>
            <h2 id="detail-title">${recipe.name}</h2>
            <p>${flavor.note}</p>
          </div>
          <span class="yield-badge">${size.yield}</span>
        </div>
        <div class="detail-grid">
          <div class="options">
            <h3>調整你的食譜</h3>
            ${renderChoiceGroup("製作份量", recipe.sizes, state.sizeIndex, "size")}
            ${renderChoiceGroup("喜歡的口味", recipe.flavors, state.flavorIndex, "flavor")}
            ${renderChoiceGroup("製作方式", recipe.methods, state.methodIndex, "method")}
          </div>
          <div class="recipe-content">
            <section class="ingredients" aria-labelledby="ingredients-title">
              <h3 id="ingredients-title">準備材料</h3>
              <ul class="ingredient-list">
                ${ingredients.map((ingredient) => `
                  <li><span>${ingredient.name}</span><span class="ingredient-amount">${formatAmount(ingredient.amount * size.factor)} ${ingredient.unit}</span></li>
                `).join("")}
              </ul>
            </section>
            <section class="steps" aria-labelledby="steps-title">
              <h3 id="steps-title">製作步驟・${method.label}</h3>
              <p class="method-note">${method.note}</p>
              <ol class="step-list">
                ${method.steps.map((step) => `<li>${step}</li>`).join("")}
              </ol>
            </section>
          </div>
        </div>
      `;
    }

    function render() {
      renderCategories();
      renderCards();
      renderDetail();
    }

    categoryContainer.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      const visible = visibleRecipes();
      if (!visible.some((recipe) => recipe.id === state.recipeId)) {
        state.recipeId = visible[0].id;
        state.sizeIndex = Math.floor(visible[0].sizes.length / 2);
        state.flavorIndex = 0;
        state.methodIndex = 0;
      }
      render();
    });

    recipeGrid.addEventListener("click", (event) => {
      const button = event.target.closest("[data-recipe]");
      if (!button) return;
      const recipe = recipes.find((item) => item.id === button.dataset.recipe);
      state.recipeId = recipe.id;
      state.sizeIndex = Math.floor(recipe.sizes.length / 2);
      state.flavorIndex = 0;
      state.methodIndex = 0;
      render();
      detail.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    detail.addEventListener("click", (event) => {
      const button = event.target.closest("[data-group]");
      if (!button) return;
      const index = Number(button.dataset.index);
      if (button.dataset.group === "size") state.sizeIndex = index;
      if (button.dataset.group === "flavor") state.flavorIndex = index;
      if (button.dataset.group === "method") state.methodIndex = index;
      renderDetail();
    });

    render();
  </script>
</body>
</html>
